x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartrss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-smartrss}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartrss} -d ${POSTGRES_DB:-smartrss}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: smartrss-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    command: ["uvicorn", "smartrss.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-smartrss}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartrss}}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,localhost:8080,127.0.0.1,127.0.0.1:8080}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://localhost:4180}
      SSRF_BLOCKED_CIDRS: ${SSRF_BLOCKED_CIDRS:-}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: smartrss-backend:local
    build:
      context: ./backend
    profiles:
      - daemon
    restart: unless-stopped
    logging: *default-logging
    init: true
    command: ["smartrss", "worker", "run"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-smartrss}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartrss}}
      WORKER_MODE: ${WORKER_MODE:-daemon}
      WORKER_IO_CONCURRENCY: ${WORKER_IO_CONCURRENCY:-4}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-30}
      SSRF_BLOCKED_CIDRS: ${SSRF_BLOCKED_CIDRS:-}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${LAN_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  db-test:
    image: pgvector/pgvector:pg16
    profiles:
      - test
    logging: *default-logging
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-smartrss_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-smartrss_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-smartrss_test}
      TZ: UTC
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-smartrss_test} -d ${TEST_POSTGRES_DB:-smartrss_test}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
